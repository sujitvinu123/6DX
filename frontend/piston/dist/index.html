<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AERO-TWIN — 3D Aero-Piston Engine Viewport</title>
  
  <!-- Technical Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Local Offline Three.js Stack with CDN Fallback -->
  <script src="/tabhas/piston/dist/libs/three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
    }
  </script>
  <script src="/tabhas/piston/dist/libs/OrbitControls.js"></script>
  <script>
    if (typeof THREE.OrbitControls === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"><\/script>');
    }
  </script>
  <script src="/tabhas/piston/dist/libs/DRACOLoader.js"></script>
  <script>
    if (typeof THREE.DRACOLoader === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"><\/script>');
    }
  </script>
  <script src="/tabhas/piston/dist/libs/GLTFLoader.js"></script>
  <script>
    if (typeof THREE.GLTFLoader === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"><\/script>');
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #0f172a;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: #ffffff;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      outline: none;
      background-color: #ffffff;
    }

    /* SVG Overlay for Dynamic Leader Lines */
    #telemetry-svg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* Floating Labels Container */
    #telemetry-labels-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    /* Left Column Telemetry Cards */
    .telemetry-left-column {
      position: absolute;
      left: 16px;
      top: 55px;
      bottom: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      gap: 6px;
      pointer-events: none;
      z-index: 15;
      width: 150px;
    }


    /* Telemetry Card Styling */
    .telemetry-card {
      pointer-events: auto;
      position: relative;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(203, 213, 225, 0.85);
      border-radius: 6px;
      padding: 6px 10px;
      width: 150px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.07);
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'Chakra Petch', monospace;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }
    .telemetry-card:hover {
      border-color: #007f86;
      box-shadow: 0 4px 16px rgba(0, 127, 134, 0.18);
      transform: translateX(2px);
    }
    .status-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #16a34a;
      box-shadow: 0 0 6px #16a34a;
      flex-shrink: 0;
    }
    .label-name {
      font-size: 0.66rem;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .label-value {
      font-size: 0.82rem;
      font-weight: 700;
      color: #0f172a;
      margin-left: auto;
      white-space: nowrap;
    }

    /* 3D Pinpoint Dot on Engine Model */
    .telemetry-endpoint {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #007f86;
      border: 2px solid #ffffff;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 8;
      box-shadow: 0 0 8px rgba(0, 127, 134, 0.9);
      transition: opacity 0.2s ease;
    }

    /* Clean Light Technical Loading Overlay */
    #loader-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 0.4s ease;
      font-family: 'Chakra Petch', monospace;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(0, 127, 134, 0.15);
      border-top-color: #007f86;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #007f86;
      text-transform: uppercase;
    }
    .progress-bar-wrap {
      width: 180px;
      height: 4px;
      background: #e2e8f0;
      border-radius: 2px;
      margin-top: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #007f86;
      transition: width 0.2s ease;
    }

    /* Top-Right Controls Toolbar */
    .toolbar {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      gap: 6px;
      z-index: 20;
      font-family: 'Chakra Petch', monospace;
    }
    .tool-btn {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 6px 11px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      font-family: inherit;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .tool-btn:hover {
      background: #f1f5f9;
      border-color: #007f86;
      color: #007f86;
      transform: translateY(-1px);
    }
    .tool-btn.active {
      background: #007f86;
      border-color: #007f86;
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(0, 127, 134, 0.25);
    }

    /* Bottom Info Status */
    .hud-bottom {
      position: absolute;
      bottom: 8px;
      right: 14px;
      font-family: 'Chakra Petch', monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #94a3b8;
      z-index: 20;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- SVG Overlay for Leader Lines -->
  <svg id="telemetry-svg-overlay"></svg>

  <!-- Floating Telemetry Labels & Pinpoint Container -->
  <div id="telemetry-labels-container"></div>

  <!-- Loading Overlay -->
  <div id="loader-overlay">
    <div class="spinner"></div>
    <div class="loader-text" id="loader-title">Loading Authentic 3D Engine Model...</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="loader-fill"></div>
    </div>
  </div>

  <!-- Top-Right Controls Toolbar -->
  <div class="toolbar">
    <button class="tool-btn active" id="btn-standard" title="Standard Photorealistic PBR Mode">STANDARD TWIN</button>
    <button class="tool-btn" id="btn-xray" title="Holographic X-Ray Mode">X-RAY & SENSORS</button>
    <button class="tool-btn" id="btn-wireframe" title="Toggle Wireframe Mesh">WIREFRAME</button>
    <button class="tool-btn active" id="btn-auto-rotate" title="Toggle Auto-Rotation">AUTO-ROTATE</button>
    <button class="tool-btn" id="btn-reset" title="Reset Camera View">RESET VIEW</button>
  </div>

  <div class="hud-bottom">
    <span>AUTHENTIC 3D ENGINE ASSET: /models/engine.glb // AUTO-ROTATION ACTIVE</span>
  </div>

  <script>
    // 1. Scene & White Studio Background
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);
    scene.fog = new THREE.FogExp2(0xffffff, 0.012);

    // 2. Camera Setup
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const initialCamPos = new THREE.Vector3(3.2, 1.8, 3.8);
    camera.position.copy(initialCamPos);

    // 3. Renderer Setup
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
    if (THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // 4. Orbit Controls (AUTO-ROTATE ENABLED BY DEFAULT)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 25;
    controls.minDistance = 0.8;
    controls.maxPolarAngle = Math.PI / 2 + 0.05;
    controls.autoRotate = true; // Auto-rotate active
    controls.autoRotateSpeed = 0.8;
    controls.target.set(0, 0, 0);
    controls.update();

    // 5. Studio Aerospace Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0xe2e8f0, 1.0);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(6, 12, 8);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.bias = -0.0001;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x007f86, 0.9);
    fillLight.position.set(-8, 4, -6);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 1.2);
    rimLight.position.set(0, -6, -8);
    scene.add(rimLight);

    // 6. Ground Stand & Shadow Plane
    const gridHelper = new THREE.GridHelper(16, 32, 0x007f86, 0xe2e8f0);
    gridHelper.position.y = -1.2;
    gridHelper.material.opacity = 0.6;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    const shadowPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(24, 24),
      new THREE.ShadowMaterial({ opacity: 0.12 })
    );
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.position.y = -1.21;
    shadowPlane.receiveShadow = true;
    scene.add(shadowPlane);

    // 7. Authentic Engine Model State
    const engineRoot = new THREE.Group();
    engineRoot.name = 'OriginalAeroEngineGroup';
    scene.add(engineRoot);

    const originalMaterials = new Map();
    let currentMode = 'standard';
    let isWireframe = false;
    let targetRPM = 4247;
    let currentRPM = 4247;

    // Materials
    const pbrEngineMaterial = new THREE.MeshStandardMaterial({
      color: 0x64748b,
      metalness: 0.85,
      roughness: 0.28,
      envMapIntensity: 1.2
    });

    const xrayMaterial = new THREE.MeshStandardMaterial({
      color: 0x0284c7,
      metalness: 0.2,
      roughness: 0.15,
      transparent: true,
      opacity: 0.38,
      wireframe: false
    });

    // 8. GLTF Loader Setup with Draco Support
    const loader = new THREE.GLTFLoader();
    try {
      const dracoLoader = new THREE.DRACOLoader();
      dracoLoader.setDecoderPath('/draco/');
      loader.setDRACOLoader(dracoLoader);
    } catch (e) {
      console.warn('DracoLoader initialization skipped:', e);
    }

    const candidatePaths = [
      '/models/engine.glb',
      'models/engine.glb',
      '/tabhas/piston/models/engine.glb',
      '/tabhas/piston/dist/models/engine.glb',
      '../models/engine.glb'
    ];

    function finishLoading() {
      const overlay = document.getElementById('loader-overlay');
      if (overlay) {
        overlay.style.transition = 'opacity 0.4s ease';
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 400);
      }
    }

    function tryLoadModel(paths, index = 0) {
      if (index >= paths.length) {
        console.error('All GLB paths exhausted. Creating fallback mesh representation.');
        createFallbackBoxerEngine();
        finishLoading();
        return;
      }

      const path = paths[index];
      console.info(`[EngineViewport] Attempting to load original 3D engine GLB from: ${path}`);

      loader.load(
        path,
        (gltf) => {
          const model = gltf.scene;
          model.name = 'AeroPistonEngineModel';

          // Compute bounding box & normalize scale
          const box = new THREE.Box3().setFromObject(model);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          const targetScale = maxDim > 0.001 ? 3.4 / maxDim : 1.0;

          model.position.set(-center.x * targetScale, -center.y * targetScale, -center.z * targetScale);
          model.scale.setScalar(targetScale);

          // Configure meshes, shadows, and cache original materials
          model.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
              originalMaterials.set(child.uuid, child.material);

              if (child.material) {
                if (child.material.metalness !== undefined) child.material.metalness = Math.max(child.material.metalness, 0.65);
                if (child.material.roughness !== undefined) child.material.roughness = Math.min(child.material.roughness, 0.4);
              }
              if (child.geometry) child.geometry.computeVertexNormals();
            }
          });

          engineRoot.add(model);
          console.info(`[EngineViewport] Original 3D engine model successfully loaded from ${path}`);
          finishLoading();
        },
        (xhr) => {
          if (xhr.total > 0) {
            const pct = Math.min(98, Math.round((xhr.loaded / xhr.total) * 100));
            const fill = document.getElementById('loader-fill');
            const title = document.getElementById('loader-title');
            if (fill) fill.style.width = pct + '%';
            if (title) title.textContent = `Loading Engine Model (${pct}%)...`;
          }
        },
        (err) => {
          console.warn(`[EngineViewport] Failed loading from ${path}:`, err);
          tryLoadModel(paths, index + 1);
        }
      );
    }

    function createFallbackBoxerEngine() {
      const g = new THREE.Group();
      const crankcaseMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.85, roughness: 0.3 });
      const crankcase = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.0, 1.4), crankcaseMat);
      crankcase.castShadow = true;
      crankcase.receiveShadow = true;
      g.add(crankcase);

      const cylMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.9, roughness: 0.2 });
      const cylGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.9, 32);
      [
        [-1.25, 0.2, -0.4], [-1.25, 0.2, 0.4],
        [ 1.25, -0.2, -0.4], [ 1.25, -0.2, 0.4]
      ].forEach(pos => {
        const cyl = new THREE.Mesh(cylGeo, cylMat);
        cyl.rotation.z = Math.PI / 2;
        cyl.position.set(...pos);
        cyl.castShadow = true;
        g.add(cyl);
      });

      engineRoot.add(g);
    }

    tryLoadModel(candidatePaths, 0);

    // 9. Interactive Modes Handling
    function applyMaterials() {
      engineRoot.traverse((child) => {
        if (child.isMesh) {
          if (currentMode === 'xray') {
            child.material = xrayMaterial;
            child.material.wireframe = isWireframe;
          } else {
            const orig = originalMaterials.get(child.uuid) || pbrEngineMaterial;
            child.material = orig;
            child.material.wireframe = isWireframe;
          }
        }
      });
    }

    document.getElementById('btn-standard').addEventListener('click', function() {
      currentMode = 'standard';
      this.classList.add('active');
      document.getElementById('btn-xray').classList.remove('active');
      applyMaterials();
    });

    document.getElementById('btn-xray').addEventListener('click', function() {
      currentMode = 'xray';
      this.classList.add('active');
      document.getElementById('btn-standard').classList.remove('active');
      applyMaterials();
    });

    document.getElementById('btn-wireframe').addEventListener('click', function() {
      isWireframe = !isWireframe;
      this.classList.toggle('active', isWireframe);
      applyMaterials();
    });

    document.getElementById('btn-auto-rotate').addEventListener('click', function() {
      controls.autoRotate = !controls.autoRotate;
      this.classList.toggle('active', controls.autoRotate);
    });

    document.getElementById('btn-reset').addEventListener('click', function() {
      controls.reset();
      camera.position.copy(initialCamPos);
      controls.target.set(0, 0, 0);
      controls.update();
    });

    // 10. Dynamic Pin Point Telemetry Markings & Leader Lines
    const svgOverlay = document.getElementById('telemetry-svg-overlay');
    const labelsContainer = document.getElementById('telemetry-labels-container');

    const leftColumnMarkers = [
      {
        id: 'rpm',
        label: 'RPM',
        unit: 'RPM',
        anchorOffset: new THREE.Vector3(-1.25, 0.15, -0.15),
        format: (val) => Math.round(Number(val ?? 4247)).toLocaleString('en-US'),
        val: 4247
      },
      {
        id: 'fuel',
        label: 'FUEL FLOW',
        unit: 'L/h',
        anchorOffset: new THREE.Vector3(-0.65, 0.60, 0.25),
        format: (val) => Number(val ?? 7.95).toFixed(1),
        val: 7.95
      },
      {
        id: 'cht',
        label: 'CHT',
        unit: '°C',
        anchorOffset: new THREE.Vector3(-0.85, 0.20, 0.65),
        format: (val) => Math.round(Number(val ?? 100.2)).toString(),
        val: 100.2
      },
      {
        id: 'oil_press',
        label: 'OIL PRESS',
        unit: 'bar',
        anchorOffset: new THREE.Vector3(-0.35, -0.40, -0.45),
        format: (val) => Number(val ?? 4.2).toFixed(1),
        val: 4.2
      },
      {
        id: 'egt',
        label: 'EGT',
        unit: '°C',
        anchorOffset: new THREE.Vector3(-0.15, -0.75, 0.45),
        format: (val) => Math.round(Number(val ?? 659)).toString(),
        val: 659
      },
      {
        id: 'oil_temp',
        label: 'OIL TEMP',
        unit: '°C',
        anchorOffset: new THREE.Vector3(0.55, -0.70, -0.2),
        format: (val) => Math.round(Number(val ?? 88)).toString(),
        val: 88
      },
      {
        id: 'vib',
        label: 'VIBRATION',
        unit: 'g',
        anchorOffset: new THREE.Vector3(-0.10, 0.78, 0.05),
        format: (val) => Number(val ?? 0.14).toFixed(2),
        val: 0.14
      }
    ];

    const markerElements = [];

    function initTelemetryDOM() {
      labelsContainer.innerHTML = '';
      svgOverlay.innerHTML = '';

      // Left Column DOM (all markers aligned on the side)
      const leftCol = document.createElement('div');
      leftCol.className = 'telemetry-left-column';
      labelsContainer.appendChild(leftCol);

      leftColumnMarkers.forEach(m => {
        const item = createCardAndEndpoint(m, leftCol);
        markerElements.push(item);
      });
    }

    function createCardAndEndpoint(m, parentContainer) {
      const card = document.createElement('div');
      card.className = 'telemetry-card';
      card.id = `card-${m.id}`;

      const dot = document.createElement('div');
      dot.className = 'status-indicator';

      const label = document.createElement('span');
      label.className = 'label-name';
      label.textContent = m.label;

      const val = document.createElement('span');
      val.className = 'label-value';
      val.id = `val-${m.id}`;
      val.textContent = `${m.format(m.val)} ${m.unit}`;

      card.appendChild(dot);
      card.appendChild(label);
      card.appendChild(val);
      parentContainer.appendChild(card);

      // Pinpoint 3D Endpoint
      const endpoint = document.createElement('div');
      endpoint.className = 'telemetry-endpoint';
      endpoint.id = `endpoint-${m.id}`;
      labelsContainer.appendChild(endpoint);

      // SVG Leader Line
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('stroke', '#007f86');
      line.setAttribute('stroke-width', '1.5');
      line.setAttribute('stroke-dasharray', '3,3');
      line.setAttribute('opacity', '0.75');
      svgOverlay.appendChild(line);

      return { config: m, cardEl: card, valEl: val, endpointEl: endpoint, lineEl: line };
    }

    initTelemetryDOM();

    function updateMarkerPositions() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      svgOverlay.setAttribute('width', width.toString());
      svgOverlay.setAttribute('height', height.toString());

      markerElements.forEach(({ config, cardEl, endpointEl, lineEl }) => {
        const worldPos = config.anchorOffset.clone();
        engineRoot.localToWorld(worldPos);

        const proj = worldPos.project(camera);

        // If behind camera plane
        if (proj.z > 1.0) {
          endpointEl.style.opacity = '0';
          lineEl.setAttribute('opacity', '0');
          return;
        }

        const endX = (proj.x * 0.5 + 0.5) * width;
        const endY = (-proj.y * 0.5 + 0.5) * height;

        endpointEl.style.left = `${endX}px`;
        endpointEl.style.top = `${endY}px`;

        // Check if anchor is front-facing toward camera or rotated to the back
        const anchorDir = worldPos.clone().normalize();
        const camDir = camera.position.clone().normalize();
        const dot = anchorDir.dot(camDir);
        const isFrontFacing = dot > -0.05; // Visible on front/side view

        if (isFrontFacing) {
          // ACTIVE STATE: Bright, vibrant pinpoint with glowing dot and clear leader line
          endpointEl.style.opacity = '1';
          endpointEl.style.background = '#007f86';
          endpointEl.style.borderColor = '#ffffff';
          endpointEl.style.boxShadow = '0 0 8px rgba(0, 127, 134, 0.9)';
          endpointEl.style.transform = 'translate(-50%, -50%) scale(1)';

          lineEl.setAttribute('stroke', '#007f86');
          lineEl.setAttribute('stroke-width', '1.5');
          lineEl.setAttribute('stroke-dasharray', '3,3');
          lineEl.setAttribute('opacity', '0.75');

          cardEl.style.opacity = '1';
          const dotEl = cardEl.querySelector('.status-indicator');
          if (dotEl) {
            dotEl.style.background = '#16a34a';
            dotEl.style.boxShadow = '0 0 6px #16a34a';
          }
        } else {
          // DISABLED STATE: As requested, visualized but like disabled (muted, dimmed, faint leader line)
          endpointEl.style.opacity = '0.35';
          endpointEl.style.background = '#94a3b8';
          endpointEl.style.borderColor = '#cbd5e1';
          endpointEl.style.boxShadow = 'none';
          endpointEl.style.transform = 'translate(-50%, -50%) scale(0.85)';

          lineEl.setAttribute('stroke', '#94a3b8');
          lineEl.setAttribute('stroke-width', '1.0');
          lineEl.setAttribute('stroke-dasharray', '2,4');
          lineEl.setAttribute('opacity', '0.20');

          cardEl.style.opacity = '0.6';
          const dotEl = cardEl.querySelector('.status-indicator');
          if (dotEl) {
            dotEl.style.background = '#94a3b8';
            dotEl.style.boxShadow = 'none';
          }
        }

        const rect = cardEl.getBoundingClientRect();
        const startX = rect.right;
        const startY = rect.top + rect.height / 2;

        lineEl.setAttribute('x1', startX.toString());
        lineEl.setAttribute('y1', startY.toString());
        lineEl.setAttribute('x2', endX.toString());
        lineEl.setAttribute('y2', endY.toString());
      });
    }

    // 11. Live Telemetry Listener from digital-twin.html
    window.addEventListener('message', function(event) {
      const data = event.data;
      if (!data) return;

      if (data.type === 'aero_twin_telemetry' && data.state) {
        const s = data.state;
        const m = s.measured || s;

        markerElements.forEach(({ config, valEl }) => {
          let rawVal;
          switch (config.id) {
            case 'rpm': rawVal = m.rpm; break;
            case 'fuel': rawVal = m.fuel_flow_lph; break;
            case 'cht': rawVal = m.cht_3_c ?? m.cht_1_c; break;
            case 'oil_press': rawVal = m.oil_pressure_bar; break;
            case 'egt': rawVal = m.egt_3_c ?? m.egt_1_c; break;
            case 'oil_temp': rawVal = m.oil_temp_c; break;
            case 'vib': rawVal = m.vib_rms_g ?? m.vibration_g; break;
          }
          if (rawVal !== undefined && rawVal !== null) {
            config.val = rawVal;
            valEl.textContent = `${config.format(rawVal)} ${config.unit}`;
          }
        });

        if (m.rpm !== undefined) {
          targetRPM = Number(m.rpm);
        }
      }
    });

    // 12. Animation Loop
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      // Smooth RPM transition
      currentRPM += (targetRPM - currentRPM) * Math.min(delta * 4.0, 1.0);

      // Controls update handles auto-rotation
      controls.update();

      // Update 3D pinpoint markers and SVG leader lines
      updateMarkerPositions();

      renderer.render(scene, camera);
    }
    animate();

    // 13. Window Resize Handler
    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateMarkerPositions();
    });
  </script>
</body>
</html>
